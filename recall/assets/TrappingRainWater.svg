<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" role="img" aria-labelledby="title desc">
  <title id="title">Trapping rain water with two boundary maxima</title>
  <desc id="desc">An elevation chart for heights 4, 2, 0, 3, 2, and 5. Four shaded regions hold 2, 4, 1, and 2 water units. The left maximum is 4 and the right maximum is 5, so the algorithm advances from the left and finalizes the next position.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#172033"/>
    </marker>
  </defs>

  <rect width="920" height="530" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">Why the smaller boundary decides the next side</text>
  <text x="460" y="62" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">Example: heights [4, 2, 0, 3, 2, 5]</text>

  <rect x="55" y="82" width="210" height="46" rx="9" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="160" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#78350f">leftMax = 4</text>
  <line x1="160" y1="128" x2="135" y2="180" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="655" y="82" width="210" height="46" rx="9" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
  <text x="760" y="111" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#4c1d95">rightMax = 5</text>
  <line x1="760" y1="128" x2="760" y2="134" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="68" y1="380" x2="850" y2="380" stroke="#172033" stroke-width="3"/>
  <line x1="100" y1="188" x2="795" y2="188" stroke="#0369a1" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="310" y="151" width="300" height="28" rx="7" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="460" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0c4a6e">confirmed water level = min(4, 5) = 4</text>

  <rect x="100" y="188" width="70" height="192" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="225" y="284" width="70" height="96" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="475" y="236" width="70" height="144" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="600" y="284" width="70" height="96" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <rect x="725" y="140" width="70" height="240" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>

  <rect x="225" y="188" width="70" height="96" fill="#7dd3fc" fill-opacity="0.82" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="350" y="188" width="70" height="192" fill="#7dd3fc" fill-opacity="0.82" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="475" y="188" width="70" height="48" fill="#7dd3fc" fill-opacity="0.82" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="600" y="188" width="70" height="96" fill="#7dd3fc" fill-opacity="0.82" stroke="#0369a1" stroke-width="1.5"/>

  <text x="260" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">+2</text>
  <text x="385" y="292" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">+4</text>
  <text x="510" y="220" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0c4a6e">+1</text>
  <text x="635" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">+2</text>

  <g font-family="sans-serif" font-size="14" fill="#172033" text-anchor="middle">
    <text x="135" y="403">i=0 · h=4</text>
    <text x="260" y="403">i=1 · h=2</text>
    <text x="385" y="403">i=2 · h=0</text>
    <text x="510" y="403">i=3 · h=3</text>
    <text x="635" y="403">i=4 · h=2</text>
    <text x="760" y="403">i=5 · h=5</text>
  </g>

  <rect x="90" y="437" width="740" height="69" rx="11" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="460" y="465" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#064e3b">leftMax ≤ rightMax, so advance left and finalize that position</text>
  <text x="460" y="490" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#065f46">At index 1: trapped water = leftMax − height = 4 − 2 = 2</text>
</svg>
